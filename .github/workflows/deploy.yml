name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bearbeitete Issues in Datei schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Release Notes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # Auslesen der letzten geschlossenen Issues
          ISSUES=$(gh issue list --state closed --limit 50 --json number,title --template '{{range .}}- [#{{.number}}] {{.title}}{{"\n"}}{{end}}')
          
          if [ -z "$ISSUES" ]; then
            echo "Keine geschlossenen Issues gefunden." >> RELEASE_NOTES.md
          else
            echo "$ISSUES" >> RELEASE_NOTES.md
          fi
          
          # Zur Kontrolle im Action-Log ausgeben:
          cat RELEASE_NOTES.md
      - name: Dynamic Config für Server erstellen
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S')" > server-config.txt
          echo "BUILD_ENV=production" >> server-config.txt
      - name: Versionsnummer in Datei aktualisieren
        run: |
          # Nutzt die fortlaufende Build-Nummer von GitHub Actions (z. B. 1.0.42)
          echo "1.0.${{ github.run_number }}" > version.txt

      - name: Änderungen zurück ins GitHub-Repo committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Version und Release Notes aktualisiert [skip ci]"
          file_pattern: "version.txt RELEASE_NOTES.md"

      - name: Geänderte Dateien auf den Server laden (FTP)
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Skript auf dem Server anstarten (via HTTP-Webhook)
        run: |
          curl -s -X POST "https://deine-domain.de/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"
