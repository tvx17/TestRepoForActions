name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version and create release info as PHP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Read old version from version.php
          if [ -f version.php ]; then
            OLD_VERSION=$(php -r "echo include 'version.php';" 2>/dev/null || echo "1.0.0")
          else
            OLD_VERSION="1.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          # 2. Fetch issues
          FEATURE_JSON=$(gh issue list --repo ${{ github.repository }} --state closed --label "Feature" --limit 50 --json number,title)
          BUG_JSON=$(gh issue list --repo ${{ github.repository }} --state closed --label "Bug" --limit 50 --json number,title)

          FEATURE_COUNT=$(echo "$FEATURE_JSON" | jq length)
          BUG_COUNT=$(echo "$BUG_JSON" | jq length)

          # 3. Calculate new version
          if [ "$FEATURE_COUNT" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUG_COUNT" -gt 0 ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Update version.php
          cat <<EOF > version.php
          <?php
          return '${NEW_VERSION}';
          EOF

          # 4. Dynamically generate release file via PHP (avoids Bash escaping issues)
          RELEASE_FILE="release_${NEW_VERSION}.php"
          export FEATURE_JSON BUG_JSON NEW_VERSION RELEASE_FILE

          php -r '
          $features = json_decode(getenv("FEATURE_JSON"), true) ?? [];
          $bugs = json_decode(getenv("BUG_JSON"), true) ?? [];
          $version = getenv("NEW_VERSION");

          $formatIssues = function(array $issues): array {
              $result = [];
              foreach ($issues as $issue) {
                  $result[$issue["number"]] = $issue["title"];
              }
              return $result;
          };

          $data = [
              "version" => $version,
              "features" => $formatIssues($features),
              "bugs" => $formatIssues($bugs),
          ];

          $export = var_export($data, true);
          $content = "<?php\n\nreturn {$export};\n";
          file_put_contents(getenv("RELEASE_FILE"), $content);
          '

          # Output for verification
          cat "$RELEASE_FILE"

      - name: Create buildDate.php
        run: |
          cat <<EOF > buildDate.php
          <?php
          return '$(date -u +'%Y-%m-%d %H:%M:%S')';
          EOF

      - name: Create production .env file
        env:
          ENV_CONTENT: ${{ secrets.PROD_ENV }}
        run: |
          echo "$ENV_CONTENT" > .env

      - name: Commit changes back to GitHub repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Version und Release Notes aktualisiert [skip ci]"
          file_pattern: "version.php release_*.php buildDate.php"

      - name: Upload changed files to server (FTP)
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Execute commands on target server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /html/dein-projektordner
            
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Call webhook
        run: |
          curl -s -X POST "https://deine-domain.de/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"
