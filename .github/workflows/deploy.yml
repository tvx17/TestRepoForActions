name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version berechnen und Release-Info als PHP erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Alte Version einlesen
          if [ -f version.txt ]; then
            OLD_VERSION=$(cat version.txt)
          else
            OLD_VERSION="1.0.0"
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          # 2. Issues abrufen
          FEATURE_JSON=$(gh issue list --repo ${{ github.repository }} --state closed --label "Feature" --limit 50 --json number,title)
          BUG_JSON=$(gh issue list --repo ${{ github.repository }} --state closed --label "Bug" --limit 50 --json number,title)

          FEATURE_COUNT=$(echo "$FEATURE_JSON" | jq length)
          BUG_COUNT=$(echo "$BUG_JSON" | jq length)

          # 3. Neue Version berechnen
          if [ "$FEATURE_COUNT" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUG_COUNT" -gt 0 ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          
          # 4. Release Notes als Variable aufbauen
          RN_CONTENT=""
          if [ "$FEATURE_COUNT" -gt 0 ]; then
            RN_CONTENT+="## Features"$'\n'
            RN_CONTENT+=$(echo "$FEATURE_JSON" | jq -r '.[] | "- [#\(.number)] \(.title)"')
            RN_CONTENT+=$'\n\n'
          fi
          
          if [ "$BUG_COUNT" -gt 0 ]; then
            RN_CONTENT+="## Bugs"$'\n'
            RN_CONTENT+=$(echo "$BUG_JSON" | jq -r '.[] | "- [#\(.number)] \(.title)"')
            RN_CONTENT+=$'\n'
          fi

          if [ "$FEATURE_COUNT" -eq 0 ] && [ "$BUG_COUNT" -eq 0 ]; then
             RN_CONTENT="Keine gelabelten Issues (Feature/Bug) für dieses Release geschlossen."
          fi

          # 5. PHP-Datei generieren
          cat <<EOF > release_info.php
          <?php

          return [
              'version' => '${NEW_VERSION}',
              'notes' => <<< 'EOT'
          ${RN_CONTENT}
          EOT
          ];
          EOF
          
          # Zur Kontrolle ausgeben
          cat release_info.php

      - name: buildDate.php erstellen
        run: |
          echo "<?php" > buildDate.php
          echo "return '$(date -u +'%Y-%m-%d %H:%M:%S')';" >> buildDate.php

      - name: Production .env-Datei erstellen
        env:
          ENV_CONTENT: ${{ secrets.PROD_ENV }}
        run: |
          echo "$ENV_CONTENT" > .env

      - name: Änderungen zurück ins GitHub-Repo committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Version und Release Notes aktualisiert [skip ci]"
          file_pattern: "version.txt release_info.php buildDate.php"

      - name: Geänderte Dateien auf den Server laden (FTP)
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Befehle auf dem Zielserver via SSH ausführen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /html/dein-projektordner
            
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Webhook aufrufen
        run: |
          curl -s -X POST "https://deine-domain.de/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"
